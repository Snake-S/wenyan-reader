<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文言文对照 · 原文 译文 赏析</title>
<style>
  :root{
    --paper:#f6f1e5;
    --card:#fdfaf2;
    --ink:#2c2620;
    --ink-light:#7a7060;
    --seal:#a03a2a;
    --gold:#b8860b;
    --green-bg:#eef3e6;
    --green-bd:#9db87a;
    --note-bg:#fdf3d7;
    --note-bd:#c9a227;
    --line:#e5dcc8;
    --hover-bg:#fff6da;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Songti SC","STSong","SimSun",serif;
    line-height:1.7;
  }
  /* ============ 页头 ============ */
  header.top{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#f9f5ea 0%,#f6f1e5 100%);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 6px rgba(60,50,30,.06);
    padding:14px 22px 10px;
  }
  .top-row{
    max-width:1200px;margin:0 auto 10px;
    display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  }
  h1.site-title{
    font-size:24px;letter-spacing:6px;font-weight:700;color:var(--ink);
  }
  h1.site-title .seal{
    display:inline-block;background:var(--seal);color:#fff;
    font-size:13px;letter-spacing:2px;padding:2px 8px;border-radius:3px;
    vertical-align:middle;margin-right:10px;font-family:inherit;
  }
  .site-sub{font-size:13px;color:var(--ink-light);letter-spacing:1px}
  .search-wrap{margin-left:auto;position:relative}
  #search{
    font-family:inherit;font-size:14px;color:var(--ink);
    width:240px;padding:7px 12px 7px 30px;
    border:1px solid var(--line);border-radius:20px;background:#fffdf7;
    outline:none;transition:border-color .2s;
  }
  #search:focus{border-color:var(--gold)}
  .search-wrap::before{
    content:"搜";position:absolute;left:10px;top:50%;transform:translateY(-50%);
    font-size:12px;color:var(--ink-light);
  }
  /* ============ Tab 栏 ============ */
  #tabs{
    max-width:1200px;margin:0 auto;
    display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto;cursor:pointer;text-align:left;
    background:transparent;border:1px solid transparent;border-bottom:none;
    border-radius:8px 8px 0 0;
    padding:7px 14px 6px;
    font-family:inherit;color:var(--ink-light);
    transition:background .15s,color .15s;
    white-space:nowrap;
  }
  .tab:hover{background:#efe8d6;color:var(--ink)}
  .tab.active{
    background:var(--card);color:var(--ink);
    border-color:var(--line);
    box-shadow:0 -2px 0 var(--seal) inset;
  }
  .tab-title{display:block;font-size:15px;font-weight:700;letter-spacing:1px}
  .tab-sub{display:block;font-size:11px;opacity:.75;letter-spacing:.5px}
  #no-result{
    max-width:1200px;margin:8px auto 0;font-size:13px;color:var(--seal);
    display:none;
  }
  /* ============ 正文 ============ */
  main{max-width:1200px;margin:0 auto;padding:24px 22px 80px}
  .art-head{margin-bottom:26px;text-align:center}
  .art-head h2{
    font-size:30px;letter-spacing:10px;font-weight:700;
    padding-left:10px; /* 抵消 letter-spacing */
  }
  .art-meta{
    margin-top:8px;font-size:14px;color:var(--ink-light);letter-spacing:2px;
  }
  .art-meta b{color:var(--seal);font-weight:600}
  .brief{
    margin:18px auto 0;max-width:860px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px 20px;font-size:14px;color:#5a5244;text-align:left;
    line-height:1.9;
  }
  .brief::before{
    content:"解题";display:inline-block;
    background:var(--seal);color:#fff;font-size:12px;letter-spacing:2px;
    padding:1px 8px;border-radius:3px;margin-right:8px;vertical-align:1px;
  }
  /* 对照表格(每单元左右对齐) */
  .unit{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);
    border:1px solid var(--line);border-radius:8px;
    margin-bottom:10px;background:var(--card);
    overflow:hidden;
    transition:box-shadow .15s;
  }
  .unit:hover{
    box-shadow:0 2px 10px rgba(140,110,40,.18);
    border-color:#d8c89a;
  }
  .unit.para{margin-top:26px}   /* 新段落开始 */
  .orig{
    padding:16px 20px;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;
    font-size:19px;line-height:2;
    background:#fdfaf2;
    border-right:1px dashed #d8cfb8;
    transition:background .12s;
  }
  .unit.para .orig{text-indent:2em}
  .side{padding:14px 18px 14px 20px;display:flex;flex-direction:column;gap:9px}
  /* hover 联动:鼠标悬停原文时,右侧同步高亮 */
  .orig:hover{background:var(--hover-bg)}
  .unit:hover .orig{background:var(--hover-bg)}
  .unit:hover .side{background:#fffdf4}
  .trans{font-size:15px;color:#3d382f;line-height:1.9}
  .comm{
    font-size:13px;color:#55603f;line-height:1.85;
    background:var(--green-bg);border-left:3px solid var(--green-bd);
    border-radius:0 6px 6px 0;padding:8px 12px;
  }
  .comm-tag{
    display:inline-block;background:var(--green-bd);color:#fff;
    font-size:11px;letter-spacing:2px;padding:0 6px;border-radius:3px;
    margin-right:8px;vertical-align:1px;
  }
  .note{
    font-size:13px;color:#6a5518;line-height:1.85;
    background:var(--note-bg);border-left:3px solid var(--note-bd);
    border-radius:0 6px 6px 0;padding:8px 12px;
  }
  .note-tag{
    display:inline-block;background:var(--note-bd);color:#fff;
    font-size:11px;letter-spacing:2px;padding:0 6px;border-radius:3px;
    margin-right:8px;vertical-align:1px;
  }
  .note b{color:#8a6a00;margin-right:6px}
  footer{
    text-align:center;color:var(--ink-light);font-size:12px;
    padding:30px 0 40px;letter-spacing:1px;
  }
  /* ============ 窄屏 ============ */
  @media (max-width:860px){
    .unit{grid-template-columns:1fr}
    .orig{border-right:none;border-bottom:1px dashed #d8cfb8}
    .search-wrap{margin-left:0;width:100%}
    #search{width:100%}
    h1.site-title{font-size:20px;letter-spacing:3px}
    .art-head h2{font-size:24px;letter-spacing:5px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1 class="site-title"><span class="seal">文言</span>古文对照读本</h1>
    <span class="site-sub">原文 · 译文 · 赏析 三栏对照｜悬停即联动</span>
    <div class="search-wrap"><input id="search" type="text" placeholder="按篇名 / 作者 / 朝代检索…"></div>
  </div>
  <nav id="tabs"></nav>
  <div id="no-result">没有找到匹配的文章,换个关键词试试。</div>
</header>
<main>
  <div id="article-body"></div>
  <footer>初高中语文教材经典文言篇目 · 原文据通行教材版本 · 赏析与史识仅供参考</footer>
</main>
<script>
const ARTICLES = [];
/* ============ 兰亭集序 · 王羲之 ============ */
ARTICLES.push({
  id:'lantingxu', title:'兰亭集序', author:'王羲之', dynasty:'东晋', year:'永和九年(353)',
  tags:['兰亭','王羲之','修禊','生死','行书','骈散'],
  brief:'永和九年三月初三,王羲之与谢安、孙绰等四十一位名士会于会稽山阴之兰亭,曲水流觞,赋诗抒怀。本篇是为当日诗集所作的序文。文章由良辰美景之乐,转入死生变迁之痛,再以"后之览者"收束,把一次雅集升华为对生命价值的千古叩问。其手稿即"天下第一行书"《兰亭序》。',
  units:[
    {p:true, o:'永和九年,岁在癸丑,暮春之初,会于会稽山阴之兰亭,修禊事也。',
     t:'永和九年,正是癸丑之年,暮春三月初,我们在会稽郡山阴县的兰亭聚会,举行修禊的仪式。',
     c:'开篇以年、月、地、事四要素落笔,简洁如史官记事,毫不渲染而盛会自见。"暮春之初"为全文定下清和明丽的基调。',
     note:{title:'修禊与兰亭雅集', text:'修禊是上古流传的民俗:三月上巳日到水边洗濯,祓除不祥,后来演变为春游宴饮的雅集。兰亭之会共四十一人,临曲水列坐,酒觞漂流到谁面前便赋诗一首,不成者罚酒。当日得诗三十七首,编为《兰亭集》,王羲之乘微醺挥��作序,即是此篇。其手迹被后世尊为"天下第一行书",相传真迹由唐太宗殉葬昭陵,今传皆为唐人摹本(以神龙本最著名)。'}},
    {o:'群贤毕至,少长咸集。',
     t:'各路贤才全都到了,年长的年轻的都会聚在一起。',
     c:'仅用八字写尽盛会气象,不着一字铺陈人物,而群贤满座之状如在眼前,是极经济的笔墨。'},
    {o:'此地有崇山峻岭,茂林修竹,又有清流激湍,映带左右,引以为流觞曲水,列坐其次。',
     t:'这里有高峻的山岭、茂密的树林和修长的竹子,又有清澈湍急的溪流,环绕辉映在亭子左右,我们引来作为流觞的曲水,依次列坐在曲水之旁。',
     c:'写景只取山、林、竹、水四物,而以"崇""茂""修""清""激"诸字点染,境界清幽有致。由"清流激湍"引出"流觞曲水",自然之景与人事之乐绾合无间。',
     note:{title:'流觞曲水', text:'古人雅集的游戏:把盛酒的羽觞放在环曲的溪水中任其漂流,停在谁面前,谁便取觞饮酒、即席赋诗,诗不成则罚酒。因水道弯曲回绕,故称"曲水"。这一风雅仪式后来传入日本,演变为"曲水宴",至今犹存。'}},
    {o:'虽无丝竹管弦之盛,一觞一咏,亦足以畅叙幽情。',
     t:'虽然没有丝竹管弦演奏的盛况,但喝一点酒、作一点诗,也足以畅快地抒发深藏于心的情怀。',
     c:'"一觞一咏"两句对举,简淡中自见雅致。"幽情"二字貌似闲闲,实为下文万千感慨埋下伏笔。'},
    {p:true, o:'是日也,天朗气清,惠风和畅。',
     t:'这一天,天空晴朗,空气清新,和暖的春风舒缓轻柔。',
     c:'独句成段,八字写尽春日之美,笔致疏朗如画中留白,为下文"仰观俯察"张开一个澄明的宇宙。'},
    {o:'仰观宇宙之大,俯察品类之盛,所以游目骋怀,足以极视听之娱,信可乐也。',
     t:'抬头纵观广阔的宇宙,低头俯察繁盛的万物,借此纵目游观、驰骋胸怀,足以穷尽耳目视听的欢娱,实在快乐啊。',
     c:'"仰观""俯察"化用《周易》"仰以观于天文,俯以察于地理",在尺幅之间撑开宇宙视野。"信可乐也"一顿,乐至极处,笔锋即将陡转。',
     note:{title:'乐极而转折', text:'全文情感脉络为"乐——痛——悲"三折:一二段写景叙事之乐,第三段转入死生之痛,末段归于古今同悲而以文章传世自解。这种由乐生悲的写法,脱胎于《古诗十九首》"生年不满百"的生命咏叹,是汉魏以来生命意识觉醒的延续。'}},
    {p:true, o:'夫人之相与,俯仰一世。',
     t:'人与人相交往,俯仰之间便是一生。',
     c:'由眼前之乐转入对人生的静观。"俯仰"极言生命短促,与上文"俯察"一词字同而意远,由观物转为观命,最见笔法之妙。'},
    {o:'或取诸怀抱,悟言一室之内;或因寄所托,放浪形骸之外。',
     t:'有的人在室内倾吐自己的胸怀抱负,与友人面对面畅谈;有的人寄托情怀于外物,生活放纵不羁。',
     c:'静者晤言一室,躁者放浪形骸——两种人生姿态的概括,正是魏晋名士风流的传神写照。',
     note:{title:'魏晋风度与玄谈', text:'魏晋士人崇尚老庄,清谈玄理、服食饮酒、任性放达成为一时风气。王羲之本人即出身琅琊王氏,与谢安等交游山水。但王羲之并非一味放诞之人,他关心民生疾苦,曾在会稽减饥荒、谏北伐——懂得这种"出""处"两面,才能读懂下文对"一死生"的批驳。'}},
    {o:'虽趣舍万殊,静躁不同,当其欣于所遇,暂得于己,快然自足,不知老之将至;',
     t:'虽然取舍千差万别,安静与浮躁各不相同,但当他们为所遇的事物感到欣喜,一时自得,愉快满足,竟不知道衰老即将到来。',
     c:'"不知老之将至"暗用《论语》记孔子语"发愤忘食,乐以忘忧,不知老之将至",写尽沉溺忘我之态——愈写"快然自足",愈为下文的幻灭蓄势。'},
    {o:'及其所之既倦,情随事迁,感慨系之矣。',
     t:'等到对于自己所向往的事物已经厌倦,感情随着境遇的变迁而改变,感慨也就随之而生了。',
     c:'由"欣"而"倦",人生的常态被一语道破。此句是"乐"与"痛"之间的转轴。'},
    {o:'向之所欣,俯仰之间,已为陈迹,犹不能不以之兴怀,况修短随化,终期于尽!',
     t:'从前所喜爱的,转眼之间已成为旧迹,尚且不能不因此引发感慨,何况寿命长短听凭造化,终究要归于尽头!',
     c:'三层递进,愈转愈深:所欣之物顷刻陈迹,已足兴怀;生命修短随化,终归于尽,则痛何如之。文气跌宕而下,直逼"死生亦大"的沉痛呼喊。'},
    {o:'古人云:"死生亦大矣。"岂不痛哉!',
     t:'古人说:"死生毕竟是件大事啊。"怎么能不悲痛呢!',
     c:'引古人语作结,一字千钧。"痛"字是全文情感的第一个高峰,直抒胸臆,毫无雕饰。',
     note:{title:'"死生亦大矣"的出处', text:'语出《庄子·德充符》所引孔子语。耐人寻味的是,王羲之引庄子而反用庄子——下文明言"一死生为虚诞,齐彭殇为妄作",恰恰是对庄子齐物论(将死生、寿夭等量齐观)的有力反驳,在玄谈成风的东晋,这种直面生命真实的态度尤为振聋发聩。'}},
    {p:true, o:'每览昔人兴感之由,若合一契,未尝不临文嗟悼,不能喻之于怀。',
     t:'每当看到前人兴发感慨的缘由,与我所感慨的像符契那样相合,总免不了对着文章叹息伤悼,心里又不明白为什么会这样。',
     c:'"若合一契"写出千古共鸣:虽世殊事异,而临文兴悲之情如出一辙。由个人之痛扩展为人同此心的历史之悲。'},
    {o:'固知一死生为虚诞,齐彭殇为妄作。',
     t:'我本就知道,把死和生等同起来的说法是虚妄荒诞的,把长寿与短命等同起来的说法是妄自造作的。',
     c:'正面立论,驳斥庄子"齐物"之说,肯定生命的真实价值。在以玄虚为高的时代敢作此语,是全文思想最有光彩处。'},
    {o:'后之视今,亦犹今之视昔,悲夫!',
     t:'后人看今天,也如同今人看过去一样(而为世事兴叹),可悲啊!',
     c:'把时间之轴再向后延伸一环,悲感遂笼罩古今、无有穷已。寥寥十字,有俯仰百世之慨。'},
    {o:'故列叙时人,录其所述。虽世殊事异,所以兴怀,其致一也。后之览者,亦将有感于斯文。',
     t:'所以我一一记下当时与会的人,录下他们所作的诗篇。纵使时代变了,事情不同了,但人们兴发情怀的原因,其意趣是一样的。后世的读者,也将对这些诗文有所感慨吧。',
     c:'结穴于"后之览者",与篇首"群贤毕至"遥相呼应。既然死生不可避免,那么把一瞬间的雅集化作千古流传的文章,便是超越死亡的方式——悲慨之中,含着深沉的寄托。'}
  ]
});

/* ============ 桃花源记 · 陶渊明 ============ */
ARTICLES.push({
  id:'taohuayuan', title:'桃花源记', author:'陶渊明', dynasty:'东晋', year:'约永初二年(421)',
  tags:['陶渊明','桃花源','武陵','理想国','记','乱世'],
  brief:'本文本是《桃花源诗》前的序记,却因其完整的叙事独立成为千古名篇。渔人误入与世隔绝的桃源仙境,出来后处处志之,终不可复得。陶渊明生活在晋宋易代的乱世,借一虚构世界寄托对安宁淳朴生活的向往,"世外桃源"从此成为中国人精神版图上永恒的乌托邦。',
  units:[
    {p:true, o:'晋太元中,武陵人捕鱼为业。',
     t:'东晋太元年间,武陵郡有个人以捕鱼为生。',
     c:'时间、地点、人物、职业,史家笔法开篇,寥寥十字,俨然信史口吻——虚构故事由此获得真实的入口。',
     note:{title:'太元:乱世的年号', text:'太元是东晋孝武帝年号(376-396)。其间虽有淝水之战(383)东晋以少胜多的辉煌,但此后内忧外患不断:孙恩、卢循起义席卷东南,桓玄篡位,刘裕代晋……陶渊明(约365-427)正生活在晋宋易代之际,《桃花源记》约作于刘裕篡晋后两年。文中"避秦时乱"云云,以古讽今之意,须结合这一背景来读。武陵:今湖南常德。'}},
    {o:'缘溪行,忘路之远近。忽逢桃花林,夹岸数百步,中无杂树,芳草鲜美,落英缤纷。',
     t:'(一天,他)沿着溪水划船而行,忘记了路程的远近。忽然遇到一片桃花林,生长在溪流两岸,长达数百步,中间没有别的树,芳草鲜嫩美丽,落花纷纷飘散在地上。',
     c:'"忘"字写不觉间入迷,"忽"字写意外之奇遇。桃林纯是一片花的世界,景语如画,"落英缤纷"四字遂成后世桃花意象的滥觞。'},
    {o:'渔人甚异之,复前行,欲穷其林。',
     t:'渔人对此十分惊异,又向前划行,想要走到那片林子的尽头。',
     c:'"异"字是心理的转折点,好奇心驱动着叙事向前,引出全篇之奇境。'},
    {o:'林尽水源,便得一山,山有小口,仿佛若有光。便舍船,从口入。',
     t:'桃花林在溪水发源的地方到了尽头,便出现一座山,山上有个小洞口,隐隐约约好像有光亮。渔人就舍弃船,从洞口进去。',
     c:'由水而山、由山而洞,层层递进如探秘。"仿佛若有光"似实似幻,是全书最空灵的一笔——希望之光,隐隐在前。'},
    {o:'初极狭,才通人。复行数十步,豁然开朗。',
     t:'起初洞口很狭窄,仅容一个人通过。又走了几十步,突然变得开阔敞亮了。',
     c:'由狭入广、由暗入明,"豁然开朗"既是空间的豁然,亦是境界的顿开——后世以此语喻思路骤通,正源于此。'},
    {o:'土地平旷,屋舍俨然,有良田、美池、桑竹之属。阡陌交通,鸡犬相闻。',
     t:'(眼前)土地平坦开阔,房屋整整齐齐,有肥沃的田地、美丽的池塘和桑树竹林之类。田间小路交错相通,村落间能彼此听见鸡鸣狗叫的声音。',
     c:'白描一幅理想农耕图:田舍、池竹、阡陌、鸡犬,无一奇物,而处处安详。"鸡犬相闻"语本《老子》"邻国相望,鸡犬之声相闻",小国寡民的道家理想,化作了眼前的人间烟火。',
     note:{title:'阡陌', text:'南北向的田埂叫"阡",东西向的叫"陌","阡陌交通"即田间小路纵横交错。陶渊明笔下的桃源,男耕女织、自给自足,与老庄"小国寡民"的社会理想一脉相承。'}},
    {o:'其中往来种作,男女衣着,悉如外人。黄发垂髫,并怡然自乐。',
     t:'人们在其中来来往往,耕种劳作,男女的穿戴都跟桃花源外的人一样。老人和小孩,都安闲快乐。',
     c:'桃源中人并不奇装异服、餐霞饮露,与常人无异——理想不在奇异,而在"怡然自乐"四字:无赋税兵戈之扰,老幼各得其所。',
     note:{title:'黄发垂髫', text:'老人头发由白转黄是高寿之征,故以"黄发"借代老人;古时儿童不束发,头发下垂,故以"垂髫"借代儿童。借代手法使行文凝练典雅,是文言常用修辞。'}},
    {p:true, o:'见渔人,乃大惊,问所从来。具答之。便要还家,设酒杀鸡作食。',
     t:'桃源中人见了渔人,竟大吃一惊,问他从哪里来。(渔人)作了详细的回答。(有人)就邀请他到自己家里去,摆酒杀鸡做饭菜(款待他)。',
     c:'"大惊"二字写出与世隔绝之彻底;设酒杀鸡,则见民风之淳厚好客。惊异之后便是热情,人情之美,于细节处见之。',
     note:{title:'"要"通"邀"', text:'"便要还家"的"要"读 yāo,是"邀"的通假字。下文"此人一一为具言所闻"的"具"通"俱"(详细、一一),皆是本文需要留意的通假现象。'}},
    {o:'村中闻有此人,咸来问讯。自云先世避秦时乱,率妻子邑人来此绝境,不复出焉,遂与外人间隔。',
     t:'村里的人听说有这么一个人,都来打听消息。他们自己说,先祖为了躲避秦朝时候的战乱,带着妻子儿女和乡邻来到这个与世隔绝的地方,没有再出去,于是就同外面的人隔绝了。',
     c:'借桃源人自述点出来历,"避秦时乱"四字最可玩味——明写避秦,暗指避晋,批判的锋芒藏进历史的褶皱里。',
     note:{title:'古今异义', text:'本句集中了几处典型古今异义词:"妻子"指妻子和儿女(今义仅指男性配偶);"绝境"指与世隔绝之地(今义指没有出路的境地);"外人"指桃花源以外的世人。另"无论魏晋"的"无论"意为"更不必说",皆须按古义理解。'}},
    {o:'问今是何世,乃不知有汉,无论魏晋。此人一一为具言所闻,皆叹惋。',
     t:'(他们)问现在是什么朝代,竟然不知道有过汉朝,更不必说魏和晋了。渔人把自己知道的事一一详细地告诉了他们,(他们)都感叹惋惜。',
     c:'"不知有汉,无论魏晋"以时间的断层写出空间的隔绝,举重若轻。而数百年兴亡,只赢得桃源中人一声"叹惋"——尘世的纷扰改朝换代,在方外之人眼中不过一场徒然的折腾。'},
    {o:'余人各复延至其家,皆出酒食。停数日,辞去。此中人语云:"不足为外人道也。"',
     t:'其余的人各自又把渔人请到自己家里,都拿出酒饭(款待他)。渔人逗留了几天,向村里人告辞。村里人嘱咐他说:"(这里的事)不值得对外面的人说起啊。"',
     c:'家家延请,淳风可掬。"不足为外人道"语气温婉而深心可感——桃源中人深知尘世扰攘,惟愿此境长存,不欲为外人所知。'},
    {p:true, o:'既出,得其船,便扶向路,处处志之。',
     t:'(渔人)出来以后,找到自己的船,就顺着来时的路回去,处处都做了记号。',
     c:'"处处志之"四字最见渔人心机之俗:他念念不忘的是禀报官府、猎奇邀功。桃源的淳朴与渔人的世故,暗中对照。'},
    {o:'及郡下,诣太守,说如此。太守即遣人随其往,寻向所志,遂迷,不复得路。',
     t:'到了郡城,去拜见太守,报告了这番经历。太守随即派人跟随他前往,寻找先前所做的记号,竟然迷失了方向,再也找不到(通往桃花源的)路了。',
     c:'"遂迷,不复得路"六字冷峭之极——仙境不容俗念再入,理想不可复刻追寻。惋怅之情,弥漫纸上而不着一字议论。'},
    {o:'南阳刘子骥,高尚士也,闻之,欣然规往。未果,寻病终。后遂无问津者。',
     t:'南阳人刘子骥,是位高尚的隐士,听到这件事,高兴地计划前往。没有实现,不久就因病去世了。此后就再也没有探寻桃花源的人了。',
     c:'以真实的历史人物收束虚构的故事,虚实相生,使幻境若有其地。"无问津者"一叹,余音袅袅:连高士亦无缘一至,理想国之邈远,尽在不言中。',
     note:{title:'刘子骥其人', text:'即刘驎之,东晋著名隐士,《晋书·隐逸传》有传,好游山泽,与陶渊明同时代。以真人入幻境,是六朝志怪小说惯用笔法,令虚构倍增可信。"问津"典出《论语·微子》(长沮、桀溺耦而耕,使子路问津焉),原指询问渡口,后引申为探寻门径。'}}
  ]
});
/* ============ 滕王阁序 · 王勃 ============ */
ARTICLES.push({
  id:'tengwangge', title:'滕王阁序', author:'王勃', dynasty:'唐', year:'上元二年(675)',
  tags:['王勃','滕王阁','骈文','初唐四杰','南昌','落霞孤鹜'],
  brief:'上元二年秋,王勃南下省父路过洪州,适逢都督阎公重阳宴客于滕王阁。相传阎公本欲让女婿孟学士宿构成文,王勃不知就里,当众援笔。至"落霞与孤鹜齐飞,秋水共长天一色"一联,满座惊为天才。全文为骈文巅峰之作:写景则色彩飞动,抒怀则跌宕悲慨,"老当益壮,穷且益坚"之句,尤见少年襟怀。次年王勃渡海溺亡,年方二十余,此序遂成绝唱。',
  units:[
    {p:true, o:'豫章故郡,洪都新府。星分翼轸,地接衡��。',
     t:'这里是过去的豫章郡,如今洪州的都督府。天上属于翼、轸两星宿的分野,地上连接着衡山和庐山。',
     c:'起笔对仗工稳,以故郡、新府点出历史沿革,以星野、山川撑开空间坐标——一起笔便是俯仰天地的气象。',
     note:{title:'星分翼轸:古代分野说', text:'古人把天上二十八星宿与地上州域一一对应,称"分野"。翼、轸二宿对应楚国之地,洪州(今江西南昌)古属楚,故云。南昌汉代为豫章郡治所,唐代设洪州都督府,所以称"故郡""新府"。以天文定位开篇,是骈文铺写地方形胜的经典起法。'}},
    {o:'襟三江而带五湖,控蛮荆而引瓯越。',
     t:'(洪州)以三江为衣襟,以五湖为衣带,控制着楚地(荆州),连接着瓯越。',
     c:'"襟""带"名词活用为动词,化静为动,一句写尽洪州居中扼要的地理形势,笔力雄健。'},
    {o:'物华天宝,龙光射牛斗之墟;人杰地灵,徐孺下陈蕃之榻。',
     t:'物有精华,天有珍宝,宝剑的光芒直冲牛、斗二星的区域;人有俊杰,地有灵气,徐孺子(的贤名)使陈蕃为他放下专设的床榻。',
     c:'两组典故分咏"物"与"人",天宝人杰相对成文,既颂扬洪州,又为下文宾主俊彦张本。"人杰地灵"一语即出于此。',
     note:{title:'龙泉剑气与悬榻之谊', text:'前典:晋代张华望见牛、斗二宿间有紫气,雷焕断为宝剑之精上彻于天,后来果然在丰城(属洪州)狱基下掘得龙泉、太阿双剑。后典:东汉高士徐稚(字孺子,南昌人)不愿出仕,豫章太守陈蕃素不接宾客,唯独为徐稚特设一榻,徐稚走后便悬挂起来。两个典故皆与南昌本地相关,用典精切,是骈文家的当行本色。'}},
    {o:'雄州雾列,俊采星驰。台隍枕夷夏之交,宾主尽东南之美。',
     t:'雄伟的洪州城池如云雾般罗列,杰出的人才如流星般飞驰。城池坐落在夷狄与华夏交界之处,宾客与主人都是东南一带的俊彦。',
     c:'"雾列""星驰"两个比喻写城之盛、才之众,以自然奇观拟人文气象,宏丽飞动。'},
    {o:'都督阎公之雅望,棨戟遥临;宇文新州之懿范,襜帷暂驻。',
     t:'享有崇高声望的都督阎公,持棨戟仪仗远道而来镇守;有美好风范的新州刺史宇文氏,车驾暂时停驻于此。',
     c:'由地及人,由远及近,引出宴席主人。措辞雍容得体,是应酬文字中难得的大方笔墨。',
     note:{title:'阎公与"宿构"公案', text:'相传重阳日洪州都督阎伯屿在滕王阁大宴宾客,本欲让女婿孟学士当场展示预先写好的序文以夸宾客。王勃路过应邀,不知就里,竟欣然命笔。阎公初闻不悦,遣人伺其下笔:报"豫章故郡"则曰"亦是老生常谈",至"落霞与孤鹜齐飞"一联,不禁叹曰"此真天才,当垂不朽!"遂尽欢而罢。此事见于唐五代笔记,虽未必尽实,却为千古名文的诞生留下了生动的现场。'}},
    {o:'十旬休假,胜友如云;千里逢迎,高朋满座。腾蛟起凤,孟学士之词宗;紫电青霜,王将军之武库。',
     t:'逢十日一次的休假日,才华出众的朋友多如云集;迎接千里而来的宾客,尊贵的朋友坐满席位。(文采能使)蛟龙腾空、凤凰起舞,那是孟学士的文章宗匠;(兵器如)紫电青霜,那是王将军的武库。',
     c:'历数座中宾主,文则腾蛟起凤,武则紫电青霜,文武对举,夸饰而不失分寸,骈俪之工整于此可见。',
     note:{title:'十旬休假', text:'唐代官员每十日休息一日,称"旬休"或"旬假"。"腾蛟起凤"典出《西京杂记》——扬雄著《太玄》,梦口吐凤凰;董仲舒读书,梦蛟龙入怀——喻文才斐然。紫电、青霜皆古名剑,借指武库之利。'}},
    {o:'家君作宰,路出名区;童子何知,躬逢胜饯。',
     t:'家父在交趾做县令,我探亲途中路过这一名胜之地;我年幼无知,竟亲身参加了这样盛大的宴会。',
     c:'"童子何知"自谦中暗含初生牛犊的锐气——下文这位"童子"将语惊四座。自叙身份,为后文"三尺微命,一介书生"伏线。',
     note:{title:'王勃省父与早逝', text:'王勃(约650-676)父亲王福畤时任交趾(今越南北部)县令,王勃此行正是南下省父。这篇序是他途中的绝笔性杰作:次年八月,王勃自交趾北归,渡海溺水,惊悸而卒,年仅二十余岁。"初唐四杰"之首,才华如流星掠空,与文中"俊采星驰"四字互为谶语般的呼应。'}},
    {p:true, o:'时维九月,序属三秋。潦水尽而寒潭清,烟光凝而暮山紫。',
     t:'时间正当九月,季节属于深秋。雨后的积水消尽,寒冷的潭水清澈;烟霭凝聚,傍晚的山色泛出紫色。',
     c:'写景千古名句:一"清"一"紫",一水一山,设色浓淡相宜,画意天成。骈文至此,已臻化境。'},
    {o:'俨骖騑于上路,访风景于崇阿。临帝子之长洲,得天人之旧馆。',
     t:'在大道上驾好车马,到崇山峻岭中寻访风景。来到滕王营建的长洲,见到滕王阁这座昔日的楼馆。',
     c:'由泛写秋景转入登阁本题,笔势从容。"帝子""天人"皆指滕王,用词典雅。',
     note:{title:'滕王与滕王阁', text:'滕王李元婴是唐高祖李渊之子、唐太宗之弟,永徽四年(653)任洪州都督时营建此阁,故称"滕王阁"。滕王素以骄奢淫逸闻名,阁却因王勃一序而名垂千古——王勃文末所附诗"阁中帝子今何在?槛外长江空自流",正是对这种人事与江山对照的喟叹。滕王阁与黄鹤楼、岳阳楼并称"江南三大名楼",历经二十九次毁建,今阁为1989年重建。'}},
    {o:'层峦耸翠,上出重霄;飞阁流丹,下临无地。',
     t:'层叠的山峦耸起一片苍翠,上接云霄;凌空的阁道上丹彩流溢,下临深渊,仿佛看不到地面。',
     c:'上句仰观,下句俯瞰;"上出重霄""下临无地"夸而有节,一仰一俯之间,滕王阁的高峻凌空之势全出。'},
    {o:'鹤汀凫渚,穷岛屿之萦回;桂殿兰宫,即冈峦之体势。',
     t:'鹤所栖息的水边平地、野鸭聚集的小洲,极尽岛屿萦回曲折之致;用桂木、木兰建成的殿堂宫观,顺着冈峦的高低起伏(而构建)。',
     c:'由阁转向四围景致,水陆并举。"桂殿兰宫"与"即冈峦之体势"写出建筑与山势的浑然一体。'},
    {p:true, o:'披绣闼,俯雕甍,山原旷其盈视,川泽纡其骇瞩。',
     t:'推开雕花的阁门,俯视饰有彩绘的屋脊,山野辽阔,尽收眼底;江河湖泽迂回曲折,令人看了吃惊。',
     c:'"披""俯"两个动作,把读者亲自领上阁来。以"盈视""骇瞩"写山原川泽之大,是从人的感受落笔,景中有人。'},
    {o:'闾阎扑地,钟鸣鼎食之家;舸舰弥津,青雀黄龙之舳。',
     t:'里巷房屋遍地,多是鸣钟列鼎而食的富贵人家;大小船只挤满渡口,都是雕饰着青雀黄龙形状的大船。',
     c:'一写市井之富,一写舟舶之盛。"扑地""弥津"两个动词,写尽南昌作为江南都会的繁华。',
     note:{title:'钟鸣鼎食', text:'古代贵族进餐时鸣钟奏乐、列鼎而食,后以"钟鸣鼎食"代指豪门贵族。"闾阎"本指里巷之门,代指民居。此处极力铺写都市繁华,亦是"物华天宝、人杰地灵"的实证。'}},
    {o:'云销雨霁,彩彻区明。落霞与孤鹜齐飞,秋水共长天一色。',
     t:'云消雨停,阳光普照,天空明朗。晚霞映着孤鹜一齐飞翔,秋水和长天连成一片碧色。',
     c:'即惊动阎公的千古绝唱。上句写动:霞飞鹜翔,一点孤影点破满天绚烂;下句写静:水天一色,无垠的澄碧涵尽秋意。色彩、动静、远近、虚实,皆在对仗中融为一体。此句脱胎于庾信"落花与芝盖齐飞,杨柳共春旗一色",而青出于蓝,遂成不刊之名。',
     note:{title:'孤鹜之辩', text:'鹜即野鸭。历代读者对"落霞孤鹜"聚讼纷纭:��谓"落霞"乃傍晚的云霞,或谓指零散飘飞的"飞蛾"(南昌土语称零散之物为"落霞")。通行的浪漫解读——晚霞中一只野鸭翩然齐飞——虽未必是王勃本意,却早已融入民族审美记忆。仿此句式者代不乏人,足见其魔力。'}},
    {o:'渔舟唱晚,响穷彭蠡之滨;雁阵惊寒,声断衡阳之浦。',
     t:'傍晚渔船上传来歌声,声响直达彭蠡湖边;群雁感到寒意而惊飞,叫声直到衡阳水边才止息。',
     c:'以声写景,视听转换:歌声之乐与雁唳之凄,一暖一寒,为下文"兴尽悲来"暗设机杼。对仗之精严,声律之谐婉,唐骈之极诣。',
     note:{title:'彭蠡与回雁', text:'彭蠡即今鄱阳湖,在南昌之北。古人相信北雁南飞至衡阳回雁峰便不再南越,故衡阳又有"雁城"之称,诗词中"衡阳雁断"皆用此典。"响穷""声断"以听觉空间的极限,收束视觉空间的铺陈。'}},
    {p:true, o:'遥襟甫畅,逸兴遄飞。爽籁发而清风生,纤歌凝而白云遏。',
     t:'远大的胸怀刚刚舒展,超逸的兴致立即飞腾。箫管之声吹起,清风仿佛随之而生;纤细的歌声凝聚不散,白云仿佛为之停驻。',
     c:'由景入情,由阁中之乐写胸中之兴。"凝""遏"二字最炼:歌声能凝住白云,则歌之动人可知——不写歌声而歌声自见。'},
    {o:'睢园绿竹,气凌彭泽之樽;邺水朱华,光照临川之笔。',
     t:'(今日宴饮)好比睢园绿竹之会,豪气超过彭泽令的酒樽;(座中才俊)如邺水边的曹植咏荷,文光照映临川内史的诗笔。',
     c:'连用四典盛赞宾主文采酒兴,用典如盐入水,密而不滞。',
     note:{title:'四典连用', text:'睢园:西汉梁孝王在睢阳所筑菟园(梁园),以竹林游宴、枚乘司马相如之徒云集著称;彭泽之樽:曾任彭泽令的陶渊明,以嗜酒知名;邺水朱华:曹植在邺下所作《公宴诗》有"朱华冒绿池"之句,代指曹植;临川之笔:南朝大诗人谢灵运,曾任临川内史。四典两两相对,把眼前宾主比作古代一流的文酒风流。'}},
    {o:'四美具,二难并。穷睇眄于中天,极娱游于暇日。天高地迥,觉宇宙之无穷;兴尽悲来,识盈虚之有数。',
     t:'良辰、美景、赏心、乐事四美齐备,贤主、嘉宾二难得兼。向天空中纵目远望,在闲暇的日子尽情游乐。天高地远,觉察到宇宙的无穷无尽;兴致穷尽而悲从中来,认识到盛衰成败自有定数。',
     c:'"兴尽悲来"四字是全文情感的大转关:由极乐之巅陡然跌入身世之悲。少年登高赋诗,忽觉宇宙无穷而人生有限——这种由空间之大反观生命之小的悲感,与《兰亭集序》一脉相承。',
     note:{title:'四美二难', text:'"四美"指良辰、美景、赏心、乐事(本谢灵运《拟魏太子邺中集诗序》"天下良辰、美景、赏心、乐事,四者难并");"二难"指贤主、嘉宾难得兼有。这是骈文收束铺陈、转入议论前的常套,王勃用得毫不粘滞。'}},
    {o:'望长安于日下,目吴会于云间。地势极而南溟深,天柱高而北辰远。',
     t:'在夕阳下遥望长安,在云间俯瞰吴郡。地势向东南延伸而南海深邃,天柱高耸而北极星遥远。',
     c:'四个方位的意象层层铺开,皆可望而不可即。长安是朝廷所在——"望长安"三字,正是布衣书生对庙堂可望难即的仕途之叹,与上文"帝阍""宣室"遥相呼应。'},
    {o:'关山难越,谁悲失路之人;萍水相逢,尽是他乡之客。',
     t:'关山重重难以越过,有谁同情失意不得志的人?萍水相逢,大家都是异乡之客。',
     c:'由典丽的铺陈忽转为直白的心声,一唱三叹,是全篇情感的第一个高峰。千年之后,凡在异乡漂泊、求索无门者读之,未有不动容者。'},
    {o:'怀帝阍而不见,奉宣室以何年?',
     t:'心怀朝廷却不得一见,不知何年才能像贾谊那样在宣室被召见?',
     c:'用两典写"忠而见弃"之痛,问句收束,悲凉彻骨。',
     note:{title:'帝阍与宣室', text:'帝阍:天帝的守门人,语出屈原《离骚》"吾令帝阍开关兮,倚阊阖而望予",借指宫门、朝廷;宣室:汉未央宫前殿正室,汉文帝曾在此召见贬居长沙的贾谊问鬼神之本。王勃以贾谊自况——才高而见弃,盼朝廷如文帝召贾谊般的召见,而遥遥无期。'}},
    {p:true, o:'嗟乎!时运不齐,命途多舛。冯唐易老,李广难封。',
     t:'唉!各人时机命运不同,人生的道路多有坎坷。冯唐容易衰老,李广难以封侯。',
     c:'长叹一声,转入全篇议论的中心:时命之不齐。连缀数典,皆怀才不遇之尤者,悲慨淋漓。',
     note:{title:'冯唐与李广', text:'冯唐历经汉文帝、景帝、武帝三朝,武帝即位求贤、举荐他时,他已九十余岁,不能复为官——"冯唐易老"遂成老而不遇的代称。李广一生与匈奴大小七十余战,威名震漠北,却终身不得封侯,其孙李蔡平庸反得侯位,"李广难封"遂成千古不平之鸣。王勃连用下文贾谊、梁鸿诸典,皆在"时运不齐,命途多舛"四字笼罩之下。'}},
    {o:'屈贾谊于长沙,非无圣主;窜梁鸿于海曲,岂乏明时?',
     t:'使贾谊委屈贬谪到长沙,并非没有圣明的君主;使梁鸿逃匿到齐鲁海滨,难道不是政治清明的时代?',
     c:'妙在把矛头收住:不是君不明、时不明,而是命途使然——为下文"君子见机,达人知命"的旷达立论作铺垫。'},
    {o:'所赖君子见机,达人知命。老当益壮,宁移白首之心;穷且益坚,不坠青云之志。',
     t:'所可依仗的是:君子能窥见事机的微妙,通达之人知道自己命运的归宿。年岁虽老而壮心不已,哪能改变白头的雄心?境遇困窘而意志更加坚定,不放弃凌云之志。',
     c:'全篇的精神脊梁。由悲叹陡然振起,斩钉截铁,掷地有金石声——困境中人的自尊与担当,尽在此十六字。千年之下,"老当益壮""穷且益坚"仍是最有力的励志成语。',
     note:{title:'马援之典', text:'"老当益壮"化用《后汉书·马援传》:东汉名将马援少时曾谓宾客"丈夫为志,穷当益坚,老当益壮"。马援年六十二仍请缨出征,马革裹尸而还。王勃以二十余岁的少年引六旬老将之语自励,愈见其困厄中意气的可贵。'}},
    {o:'酌贪泉而觉爽,处涸辙以犹欢。北海虽赊,扶摇可接;东隅已逝,桑榆非晚。',
     t:'即使喝了贪泉之水,心境依然清爽;身处干涸的车辙之中,仍然乐观。北海虽然遥远,凭借大风仍可到达;早岁的时光虽已逝去,珍惜将来的岁月还为时不晚。',
     c:'四个典故层层翻案:贪泉不能污其洁,涸辙不能夺其欢,北海虽远而可至,桑榆已晚而非晚。少年人的乐观与倔强,把前文的悲凉全部压倒。',
     note:{title:'贪泉·涸辙·东隅桑榆', text:'贪泉:传说广州城外有贪泉,饮之则生贪心;晋代吴隐之为广州刺史,酌而饮之,赋诗明志,终不改廉洁。涸辙:干涸的车辙,典出《庄子·外物》中"涸辙之鲋"的寓言,喻困境。东隅(日出之地)喻早岁,桑榆(日落时余光所照之处)喻晚景,语出《后汉书·冯异传》"失之东隅,收之桑榆"。'}},
    {o:'孟尝高洁,空余报国之情;阮籍猖狂,岂效穷途之哭!',
     t:'孟尝品行高洁,却空留下报国之情;阮籍狂放不羁,我们岂能效仿他无路可走时的恸哭!',
     c:'两个反面参照:孟尝之"空余"令人叹惋,阮籍之"穷途之哭"更不足效——一收一放,把悲慨再次推向自强的立场。',
     note:{title:'孟尝与阮籍', text:'孟尝:东汉会稽上虞人,任合浦太守时革除弊政,珠还合浦;后称病隐居,桓帝时屡被荐举而终不见用,"空余报国之情"即指此。阮籍:竹林七贤之一,率意独驾,车迹所穷,辄恸哭而返——"穷途之哭"是乱世名士绝望的象��。王勃宣称不效穷途之哭,是对自己困境的最终超越。'}},
    {p:true, o:'勃,三尺微命,一介书生。无路请缨,等终军之弱冠;有怀投笔,慕宗悫之长风。',
     t:'我王勃,身份卑微,只是一个书生。(我已与终军同龄,)却无处请缨杀敌;羡慕宗悫的"乘长风破万里浪",心怀投笔从戎之志。',
     c:'转入自叙。"无路"与"有怀"对举:报国无门而壮心不已,少年不平之气喷薄欲出。',
     note:{title:'请缨·投笔·长风', text:'请缨:汉代终军十八岁时请受长缨,必缚南越王而致之阙下;投笔:班超家贫为官府抄书,投笔叹曰"大丈夫当效傅介子、张骞立功异域,安能久事笔砚间乎",遂投笔从戎,立功西域;长风:南朝宋宗悫少年时,叔父问其志,答曰"愿乘长风破万里浪"。王勃用三典,叹自己与终军同样弱冠之年却无路请缨。'}},
    {o:'舍簪笏于百龄,奉晨昏于万里。非谢家之宝树,接孟氏之芳邻。',
     t:'(我)宁愿舍去一生的功名,到万里之外朝夕侍奉父亲。自己虽算不上谢家的"芝兰玉树",却有幸接触孟母择邻般的贤者。',
     c:'此行本为省父,自陈孝志。"舍簪笏于百龄"暗含愤激:功名既然无望,不如尽孝远行——语淡而悲深。',
     note:{title:'宝树与芳邻', text:'谢家宝树:谢安问子侄为何人才辈出,谢玄答"譬如芝兰玉树,欲使其生于庭阶耳",后以"宝树"喻优秀子弟;孟氏芳邻:孟母为教子三迁择邻。两句一谦一敬,既自谦非名门佳子弟,又恭维座中皆贤德之邻。'}},
    {o:'他日趋庭,叨陪鲤对;今兹捧袂,喜托龙门。',
     t:'不久(我)将到父亲身边恭聆教诲,忝陪孔鲤趋庭之对;今日拜见阎公,有幸如鲤鱼之登龙门。',
     c:'前句说家事之孝,后句说宴遇之荣,一内一外,收束得体。',
     note:{title:'鲤对与龙门', text:'鲤对:孔子之子孔鲤趋庭而过,孔子问"学诗乎""学礼乎",教以不学诗无以言、不学礼无以立,后以"趋庭""鲤对"喻子承父教;龙门:黄河鲤鱼跃过龙门即化为龙的传说,东汉李膺声名极高,士人得其接见誉为"登龙门",此处恭维得遇阎公如登龙门。'}},
    {o:'杨意不逢,抚凌云而自惜;钟期既遇,奏流水以何惭?',
     t:'遇不到杨得意那样引荐的人,只能抚拍着自己的凌云之赋而自我惋惜;既然遇到了钟子期那样的知音,奏一曲高山流水又有什么羞愧?',
     c:'以司马相如、钟子期两典收束:前者自伤无人引荐,后者恭维阎公为知音。骈文用典之妙,尽在含蓄得体——毛遂自荐之意,说得如此风雅。'},
    {p:true, o:'呜呼!胜地不常,盛筵难再;兰亭已矣,梓泽丘墟。',
     t:'唉!名胜之地不能常存,盛大的宴会难以重逢;兰亭的盛会已成陈迹,金谷园也变成了废墟。',
     c:'由自身遭际复归于宴席本身,盛衰之感再度涌起。以兰亭、金谷两场千古雅集衬今日之会,暗示此筵亦将成陈迹——悲慨更深一层。',
     note:{title:'兰亭·金谷·滕王阁', text:'梓泽即西晋石崇的金谷园,石崇曾在此宴集名流三十人,昼夜游宴,并作《金谷园诗序》。王羲之的兰亭之会,本有与金谷雅集争胜之意;王勃在滕王阁上,又把兰亭、金谷一并拉来作参照——三场千古雅集在文中叠映,而金谷园早已丘墟、兰亭已成陈迹,则今日滕王阁之盛筵,复归于何处?用典之中有最深的时间之悲。'}},
    {o:'临别赠言,幸承恩于伟饯;登高作赋,是所望于群公。',
     t:'在这盛大的饯别宴会上承蒙恩遇写下这篇序文;至于登高作赋,那就期望于在座的诸公了。',
     c:'收束应酬,谦而能达。"登高作赋"暗用古人"登高能赋,可以为大夫"之说。'},
    {o:'敢竭鄙怀,恭疏短引;一言均赋,四韵俱成。请洒潘江,各倾陆海云尔。',
     t:'我只是冒昧地倾尽鄙陋的胸怀,恭敬地写下这篇短序;每人都按分得的字韵赋诗,我的四韵八句已经写成。请诸位施展潘岳如江、陆机如海的才情吧。',
     c:'结以谦词,邀请众人赋诗,戛然而止而余韵悠然。文中"请洒潘江,各倾陆海"既颂群公,又见少年以文会友的从容气度。',
     note:{title:'潘江陆海与《滕王阁诗》', text:'潘江陆海:西晋潘岳、陆机以文才冠世,钟嵘《诗品》有"陆才如海,潘才如江"之评。王勃序后所附即《滕王阁诗》:"滕王高阁临江渚,佩玉鸣鸾罢歌舞。画栋朝飞南浦云,珠帘暮卷西山雨。闲云潭影日悠悠,物换星移几度秋。阁中帝子今何在?槛外长江空自流。"诗与序相发,帝子已渺而江水自流——正是全文盛衰之感的最后回声。'}}
  ]
});

/* ============ 师说 · 韩愈 ============ */

  units:[
    {p:true, o:'古之学者必有师。师者,所以传道受业解惑也。',

     c:'开门见山,三句话立起全文主脑。"传道受业解惑"六字,把师的功能一网打尽,成为后世教育思想最经典的表述。',
     note:{title:'"受"通"授"', text:'"传道受业解惑"的"受"通"授"。韩愈所谓"道",指儒家之道——他自己正是以继承尧舜禹汤文武周公孔子之道自任的。值得注意的是,韩愈的"师"不限于学校之师:凡"道之所存"者皆可为师,这是对师道最宽宏也最深刻的界定。'}},
    {o:'人非生而知之者,孰能无惑?惑而不从师,其为惑也,终不解矣。',
     t:'人不是生下来就懂得道理的,谁能没有疑惑?有了疑惑却不跟从老师学习,那些疑惑,就始终不能解开了。',
     c:'以"惑"为枢纽立论:人有惑→须从师→不从师则惑终不解,逻辑链条干净利落。暗驳"生而知之"的上智论,立论平实而不可撼。'},
    {o:'生乎吾前,其闻道也固先乎吾,吾从而师之;生乎吾后,其闻道也亦先乎吾,吾从而师之。',
     t:'出生在我之前的,他懂得道理本来就比我早,我跟他学习,以他为师;出生在我之后的,如果他懂得道理也比我早,我也跟他学习,以他为师。',
     c:'以生年先后两种情况对举,结论归于一处:但问闻道之先后,不问生年之先后。推理周密,文气如江河直下。'},
    {o:'吾师道也,夫庸知其年之先后生于吾乎?是故无贵无贱,无长无少,道之所存,师之所存也。',
     t:'我学习的是道理啊,哪管他出生比我早还是晚呢?因此无论地位高低,无论年纪大小,道理存在的地方,就是老师所在的地方。',
     c:'"道之所存,师之所存也"是全篇的第一个论断结晶:择师唯一的标准是道,不是年龄、地位。这七个字至今仍是对师道最透辟的界说。'},
    {p:true, o:'嗟乎!师道之不传也久矣!欲人之无惑也难矣!',
     t:'唉!从师学习的风尚不流传已经很久了!想要人们没有疑惑,也难了!',
     c:'长叹转折,由立论转入批判现实。三个"矣"字,一路沉痛,为下文三层对比蓄满情感势能。'},
    {o:'古之圣人,其出人也远矣,犹且从师而问焉;今之众人,其下圣人也亦远矣,而耻学于师。',
     t:'古代的圣人,超出一般人很远,尚且跟从老师请教;如今的普通人,他们低于圣人也很远,却以从师学习为耻。',
     c:'第一层对比:圣人与众人。圣人愈圣、众人愈愚的根源,就在从师与耻师的一念之差。'},
    {o:'是故圣益圣,愚益愚。圣人之所以为圣,愚人之所以为愚,其皆出于此乎?',
     t:'因此圣人更加圣明,愚人更加愚昧。圣人之所以成为圣人,愚人之所以成为愚人,大概都是出于这个原因吧?',
     c:'用"其……乎"的揣度语气下断语,斩截中留余地,论说有分寸。'},
    {o:'爱其子,择师而教之;于其身也,则耻师焉,惑矣。',
     t:'(人们)疼爱自己的孩子,就选择老师来教他;对于他自己呢,却以从师学习为可耻,真是糊涂啊!',
     c:'第二层对比:对孩子择师、对自己耻师。一个"惑"字直斥其非,与前文"解惑"之"惑"遥相呼应——不肯从师的人,恰是最大的"惑"者,冷隽之极。'},
    {o:'彼童子之师,授之书而习其句读者,非吾所谓传其道解其惑者也。',
     t:'那些孩子们的老师,是教他们读书、帮助他们学习断句的,不是我所说的传授道理、解答疑难的老师。',
     c:'辨明两个"师"的概念:童子之师不过习句读之师,与传道解惑之师不可混同。概念辨析精细,驳论立于不败。'},
    {o:'句读之不知,惑之不解,或师焉,或不焉,小学而大遗,吾未见其明也。',
     t:'断句不理解,道理有疑惑,(前者)倒要从师学习,(后者)却不去请教,小的学习了,大的却丢弃了,我看不出他们有什么高明的。',
     c:'第三层对比:句读之"小"与道理之"大"。舍本逐末,荒唐自见。"小学而大遗"五字,骂尽世人而不失文雅。'},
    {o:'巫医乐师百工之人,不耻相师。士大夫之族,曰师曰弟子云者,则群聚而笑之。',
     t:'巫医、乐师和各种工匠,不以互相学习为耻;士大夫这一类人,说到谁是老师、谁是弟子这样的话,就聚在一起嘲笑他。',
     c:'第四层对比:下层工匠与上层士大夫。地位愈高而识见愈陋,"群聚而笑之"五字,画出庸众的可憎嘴脸。',
     note:{title:'唐代士大夫为何"耻于相师"', text:'魏晋以来门阀制度下,士族凭门第入仕,学问不关进身之阶;加之科举以诗赋取士,士人多恃才傲物。柳宗元《答韦中立论师道书》记载:当时士大夫"独耻相师",柳宗元不敢为人师,"独韩愈奋不顾流俗,犯笑侮,收召后学,作《师说》,因抗颜而为师",遭人聚骂,"指目牵引,增与为言辞"。可见韩愈作此文需要何等的勇气。'}},
    {o:'问之,则曰:"彼与彼年相若也,道相似也。位卑则足羞,官盛则近谀。"',
     t:'问他们(为什么笑),就说:"他和他年龄差不多,学问也相仿。(拜)地位低的人为师,就足以羞耻;拜官位高的人为师,就近乎谄媚。"',
     c:'引述耻师者的心理,替他们把丑话说明——以子之矛攻子之盾:择师只看年齿官位,正与"道之所存,师之所存"相反。'},
    {o:'呜呼!师道之不复可知矣。巫医乐师百工之人,君子不齿,今其智乃反不能及,其可怪也欤!',
     t:'唉!从师学习的风尚不能恢复,由此可以知道了。巫医、乐师、各种工匠,是士大夫们看不起的,如今士大夫的智慧反而比不上他们,真是奇怪啊!',
     c:'对比至此收束:君子"不齿"之人,其智反胜君子。"其可怪也欤"一叹,冷峭的反讽达到顶点。'},
    {p:true, o:'圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒,其贤不及孔子。',
     t:'圣人没有固定的老师。孔子曾以郯子、苌弘、师襄、老聃为师。郯子这些人,他们的贤能都不及孔子。',
     c:'举至圣先师为例,证明"无常师":孔子尚且不耻下问,则师道之尊,正在善学而不在耻师。'},
    {o:'孔子曰:"三人行,则必有我师。"是故弟子不必不如师,师不必贤于弟子,闻道有先后,术业有专攻,如是而已。',
     t:'孔子说:"几个人同行,其中一定有可以当我老师的人。"因此学生不一定不如老师,老师不一定比学生贤能,懂得道理有先有后,学问技艺各有专门研究,如此罢了。',
     c:'"弟子不必不如师,师不必贤于弟子"是全篇第二个论断结晶:师生关系是相对的、动态的。"闻道有先后,术业有专攻"十字,把师生之道升华为普遍的认识论,至今是 classrooms 与学界奉行的公理。',
     note:{title:'孔子的四位老师', text:'郯子:郯国国君,孔子曾问古代官制;苌弘:周敬王大夫,孔子问乐于他;师襄:鲁国乐官,孔子学鼓琴于他;老聃:即老子,孔子适周问礼于他。"三人行必有我师"语出《论语·述而》。圣人尚且转益多师、不耻下问——韩愈以最大的权威,封死了耻师者的退路。'}},
    {p:true, o:'李氏子蟠,年十七,好古文,六艺经传皆通习之,不拘于时,学于余。',
     t:'李家的孩子叫蟠的,十七岁,喜好古文,六经的经文和传文都全面学习过,不受时俗的约束,来向我学习。',
     c:'由议论落到赠文的本事。"不拘于时"四字是对李蟠最高的褒奖——众人皆耻师,独他肯学于余,正应"道之所存,师之所存"。',
     note:{title:'李蟠与古文运动', text:'李蟠是韩愈的弟子,贞元十九年进士。"六艺"此处指六经(《诗》《书》《礼》《易》《乐》《春秋》)。"好古文"三字尤有分量:韩愈提倡上继先秦两汉散文传统的"古文",反对六朝以来讲求声律对偶的骈体文风,史称"古文运动"。李蟠"好古文"而"不拘于时",正是这一运动的后继者。苏轼称韩愈"文起八代之衰,道济天下之溺",《师说》本身即是古文运动的典范之作。'}},
    {o:'余嘉其能行古道,作《师说》以贻之。',
     t:'我赞许他能够遵行古人从师之道,写了这篇《师说》来赠送给他。',
     c:'结穴干净:一篇雄文,只为奖掖一个肯行古道的少年。首尾以"古道"呼应,微言大义,尽在赠人一端。'}
  ]
});
/* ============ 岳阳楼记 · 范仲淹 ============ */
ARTICLES.push({
  id:'yueyanglou', title:'岳阳楼记', author:'范仲淹', dynasty:'北宋', year:'庆历六年(1046)',

  brief:'庆历新政失败后,范仲淹贬谪邓州;好友滕子京亦谪守巴陵,重修岳阳楼,寄图索记。范仲淹并未亲临岳阳楼,而是借想象中的洞庭四时之景,写迁客骚人的悲喜二感,再翻上一层,推出"不以物喜,不以己悲""先天下之忧而忧,后天下之乐而乐"的千古名训。骈散兼行,气象宏大,是中国散文史上的丰碑。',
  units:[
    {p:true, o:'庆历四年春,滕子京谪守巴陵郡。越明年,政通人和,百废俱兴。',
     t:'庆历四年春天,滕子京被贬谪到巴陵郡做太守。到了第二年,政务顺利,百姓和乐,各种荒废的事业都兴办起来。',
     c:'起笔直书本事,平实如史。"谪守"二字下得极有分寸——不讳言贬谪,又不作怨语;"政通人和"四字,已为滕子京的胸襟定了调。',
     note:{title:'庆历新政与滕子京', text:'庆历三年至五年(1043-1045),范仲淹主持"庆历新政",整饬吏治,触动权贵利益而失败,范仲淹、富弼等相继罢政外贬。滕子京名宗谅,是范仲淹同年挚友,因被人诬告滥用公使钱而谪守巴陵。他在岳州励精图治,重修岳阳楼,并去信范仲淹索记,附《洞庭晚秋图》一幅——范仲淹时知邓州(今河南邓州),并未亲到岳阳楼,全凭图卷与想象成文,却写出千古第一楼记。'}},
    {o:'乃重修岳阳楼,增其旧制,刻唐贤今人诗赋于其上。属予作文以记之。',
     t:'于是重新修建岳阳楼,扩大它原有的规模,把唐代名家和当代人的诗赋刻在楼上。嘱托我写文章来记述这件事。',
     c:'交代作文缘起。"属"通"嘱"。按常规,楼记当写楼之形胜、修之经过——下文却全部抛��,别开生面。'},
    {p:true, o:'予观夫巴陵胜状,在洞庭一湖。衔远山,吞长江,浩浩汤汤,横无际涯;朝晖夕阴,气象万千。',
     t:'我看那巴陵郡的美景,全在洞庭一湖。它连接着远方的山脉,吞吐着长江的水,浩浩荡荡,宽广无边;早晨阳光明媚,傍晚雾霭昏暗,景象千变万化。',
     c:'"衔""吞"二字有龙象之力,把湖写成吞吐山河的活物。一"衔"一"吞"一"横",大景如画,先声夺人。'},
    {o:'此则岳阳楼之大观也,前人之述备矣。然则北通巫峡,南极潇湘,迁客骚人,多会于此,览物之情,得无异乎?',
     t:'这就是岳阳楼的雄伟景象,前人的记述已经很详尽了。既然这样,那么(这里)向北通向巫峡,向南直到潇水、湘水,被贬谪的政客和诗人,大多在这里聚会,他们观赏景物时的感受,怎能不有所不同呢?',
     c:'"前人之述备矣"一句宕开——前人写尽,我不再写,笔锋转向"览物之情"。以问句引出下文两段悲喜对照,是全文的枢纽。',
     note:{title:'迁客与骚人', text:'"迁客"指迁谪之人,即被贬官外放的士人;"骚人"原指屈原《离骚》一系的诗人,泛指文人。洞庭湖正当南北水路要冲,"北通巫峡,南极潇湘",古往今来的贬谪之士南来北往多经于此——岳阳楼因此成为迁客骚人的"情感剧场"。范仲淹抓住这一特殊地理,追问:同样面对湖景,不同心境的人感受会相同吗?'}},
    {p:true, o:'若夫淫雨霏霏,连月不开,阴风怒号,浊浪排空;日星隐曜,山岳潜形;',
     t:'像那连绵的雨纷纷下着,接连几个月不放晴,阴冷的风怒吼着,浑浊的浪冲向天空;太阳和星星隐藏了光辉,山岳隐没了形迹;',
     c:'第一幅画:霪雨浊浪的暗色世界。"怒号""排空"字字挟风雨之势,天日无光,是迁客心境的外化。',
     note:{title:'"隐曜""潜形"与通假', text:'"曜"通"耀",光辉之意。注意本段连用四组景象:风、浪、星日、山岳,由天而地,层层压暗,为下文"感极而悲"蓄势。此段与下段"春和景明"一段,是唐宋写景文字中著名的"对镜":一悲一喜,互为镜像。'}},
    {o:'商旅不行,樯倾楫摧;薄暮冥冥,虎啸猿啼。登斯楼也,则有去国怀乡,忧谗畏讥,满目萧然,感极而悲者矣。',
     t:'商人和旅客无法通行,桅杆倒下,船桨折断;傍晚天色昏暗,只听到老虎的吼叫和猿猴的哀啼。(这时)登上这座楼,就会产生离开国都、怀念家乡,担心遭人诽谤、害怕被人讥讽的心情,满眼萧条冷落,感慨到极点而悲伤起来。',
     c:'景与情严丝合缝:虎啸猿啼之于去国怀乡,满目萧条之于忧谗畏讥。"感极而悲者矣"一收,写尽迁客的第一种心情。'},
    {p:true, o:'至若春和景明,波澜不惊,上下天光,一碧万顷;沙鸥翔集,锦鳞游泳;岸芷汀兰,郁郁青青。',
     t:'又如春风和暖、阳光明媚,湖面平静,没有风浪,天色湖光上下相接,一片碧绿,广阔万顷;沙鸥时而飞翔、时而停歇,美丽的鱼儿游来游去;岸上的小草、小洲上的兰花,香气浓郁,颜色青翠。',
     c:'第二幅画:春光万顷的明色世界。"上下天光,一碧万顷"境界澄澈;"沙鸥""锦鳞""芷""兰"诸物皆着欣悦之色,与前段一一对照。',
     note:{title:'互文与借代', text:'"沙鸥翔集,锦鳞游泳"用了互文修辞:沙鸥(有时)飞翔(有时)停歇,锦鳞(即鱼,借代)也在(水面)游(水底)泳——两句意思交错互补,并非鸥只飞鱼只泳。"岸芷汀兰"亦互文:岸上和小洲上都长着香草兰花。识别互文,方不误解文意。'}},
    {o:'而或长烟一空,皓月千里,浮光跃金,静影沉璧,渔歌互答,此乐何极!',
     t:'有时大片烟雾完全消散,皎洁的月光一泻千里,浮动的光闪耀着金色,静静的月影像沉入水中的玉璧,渔夫的歌声一唱一和,这样的乐趣哪有穷尽!',
     c:'"浮光跃金,静影沉璧"八字,一动一静,把月夜湖光写到了极致——金光闪烁如碎金浮动,静月映水如玉璧沉渊,炼字之精,叹为观止。'},
    {o:'登斯楼也,则有心旷神怡,宠辱偕忘,把酒临风,其喜洋洋者矣。',
     t:'(这时)登上这座楼,就会感到胸怀开阔,精神愉快,荣耀和屈辱一并忘却,端着酒杯迎着清风,那真是喜气洋洋啊。',
     c:'与前段"感极而悲"遥相对照:一悲一喜,皆因物而生——景异则情异,情随物迁,则此二种人仍为外物所支配。这正是下文要超越的层次。'},
    {p:true, o:'嗟夫!予尝求古仁人之心,或异二者之为,何哉?不以物喜,不以己悲;',
     t:'唉!我曾经探求古代品德高尚的人的思想感情,或许不同于以上两种心情,为什么呢?他们不因外物的好坏和自己处境的好坏而或喜或悲;',
     c:'全篇制高点由此托出。"或异二者之为"一问,把迁客骚人的悲喜两境整体翻过:古仁人之心,不为物役,不为己困。八字斩钉截铁,是全文的灵魂。',
     note:{title:'"古仁人"是谁', text:'范仲淹心中的"古仁人",是伊尹、颜回、诸葛亮这类人物:伊尹"思天下之民有不被尧舜之泽者,若己推而内之沟中";颜回箪食瓢饮不改其乐;诸葛亮鞠躬尽瘁。范仲淹本人亦是此道的践行者——他少年苦学断齑画粥,为官则"先天下之忧而忧",死后家中竟无余财。这不是文人空言,而是他一生的写照。'}},
    {o:'居庙堂之高则忧其民;处江湖之远则忧其君。是进亦忧,退亦忧。然则何时而乐耶?',
     t:'在朝廷做官就为百姓担忧,退隐江湖远离朝廷就为君主担忧。这样进朝为官也担忧,退居江湖也担忧。既然这样,那么什么时候才快乐呢?',
     c:'"进亦忧,退亦忧"承上启下,故意设一死结:忧无已时,乐在何处?文势如满弓,直逼最后一声弦响。'},
    {o:'其必曰"先天下之忧而忧,后天下之乐而乐"乎!噫!微斯人,吾谁与归?',
     t:'那一定要说"在天下人忧之前先忧,在天下人乐之后才乐"吧!唉!(如果)没有这种人,我同谁一道呢?',
     c:'千锤一击,推出震铄古今的十四字。忧乐先后,即圣贤分量。"微斯人,吾谁与归"以感叹作结,既自明志向,又暗与滕子京共勉——不着一字劝慰,而劝慰之意最深。',
     note:{title:'先忧后乐', text:'"先天下之忧而忧,后天下之乐而乐"化用《孟子·梁惠王下》"乐以天下,忧以天下",而境界更为凝练崇高。这十四字后来成为中国人政治伦理的最高表达之一,历代匾额楹联常引。范仲淹作记时正贬邓州,滕子京谪守巴陵——两个"处江湖之远"的人,写的却是庙堂之上的担当:这正是本文超越普通楼记、超越个人牢骚的根本所在。另:"微斯人,吾谁与归"句式本《论语·微子》"吾非斯人之徒与而谁与"。'}},
    {o:'时六年九月十五日。',
     t:'写于庆历六年九月十五日。',
     c:'以作记日期收束,史笔收梢,戛然而止。'}

  brief:'庆历新政失败,欧阳修因声援范仲淹被贬滁州。他在滁政宽简,与民同乐,于琅琊山间得僧智仙所建之亭,自号醉翁,作记名之。全文四百余字,用了二十一个"也"字,咏叹唱酬,如闻鼓点;太守之乐不在酒而在山水、不在山水而在滁人之乐——"醉翁之意不在酒"由是成为尽人皆知的成语。',
  units:[

     note:{title:'"也"字的文章', text:'全文连用二十一个"也"字,形成一唱三叹的咏叹调式:每层景物、每层情事都以"……者,……也"的判断句收束,如层波叠浪,回环成韵。据说欧阳修此文初稿开头列数滁州四面的山,改定后只剩"环滁皆山也"五字——由数十字到五字,是古文炼句最著名的公案之一。'}},
    {o:'山行六七里,渐闻水声潺潺,而泻出于两峰之间者,酿泉也。',
     t:'沿着山路走六七里,渐渐听到潺潺的水声,从两座山峰之间倾泻而出的,是酿泉。',
     c:'由视觉而听觉:"渐闻"二字尤妙,人随径转,泉声渐近,读者如亲历山行。'},
    {o:'峰回路转,有亭翼然临于泉上者,醉翁亭也。作亭者谁?山之僧智仙也。名之者谁?太守自谓也。',
     t:'山势回环,路随峰转,有一座亭子四角翘起,像鸟张开翅膀一样,高踞在泉水之上的,是醉翁亭。造亭子的人是谁?山里的僧人智仙。给它起名的人是谁?太守用自己的别号(醉翁)来命名。',
     c:'"翼然"写亭之飞动,如画之点睛。以下自问自答,层层交代,舒卷自如——散文本色,全不用骈俪而风致自远。'},
    {o:'太守与客来饮于此,饮少辄醉,而年又最高,故自号曰醉翁也。醉翁之意不在酒,在乎山水之间也。山水之乐,得之心而寓之酒也。',
     t:'太守和宾客来这里饮酒,喝得不多就醉了,而年龄又最大,所以自己取号叫"醉翁"。醉翁的心意不在酒上,而在山光水色之间啊。欣赏山水的乐趣,领会在心里,寄托在饮酒上罢了。',
     c:'"醉翁之意不在酒"点破全篇关键:醉是表,乐是里;酒是迹,山水是心。"得之心而寓之酒",一"得"一"寓",把精神归宿说得从容自在。',
     note:{title:'欧阳修为何贬滁', text:'庆历五年,欧阳修因作《朋党论》声援范仲淹新政,被政敌罗织罪名贬为滁州知州。滁州地僻事简,他反而得以寄情山水、为政宽简,百姓安居。自号"醉翁"时他年仅四十岁——"年又最高"是与会者的实情,"翁"字里却藏着佯狂遣悲的深心:同年他在《题滁州醉翁亭》中自嘲"四十未为老,醉翁偶题篇"。'}},
    {p:true, o:'若夫日出而林霏开,云归而岩穴暝,晦明变化者,山间之朝暮也。',
     t:'像那太阳出来,树林里的雾气散开;云雾聚拢,山谷就显得昏暗了,这明暗交替变化的,是山间的早晨和傍晚。',
     c:'一日之景,收于两句:日出雾散为明,云归岩暝为晦。朝暮晦明,四时之序由此引出。',
     note:{title:'若夫与互文', text:'"若夫"句式领起山间朝暮与四时之景,是骚体与骈文的遗法。注意"日出而林霏开,云归而岩穴暝"亦含互文意:日出云归,朝暮之间雾散雾聚,晦明不断变化——两句写的是整体的动态,不必拘泥于"日出"专指晨、"云归"专指暮。'}},
    {o:'野芳发而幽香,佳木秀而繁阴,风霜高洁,水落而石出者,山间之四时也。',
     t:'野花开放,散发出清幽的香气;美好的树木枝叶茂盛,形成浓密的绿荫;天高气爽,霜色洁白;水位落下,石头显露出来,这是山间的四季。',
     c:'四时之景各以二字传神:发、秀、洁、出。春芳夏阴,秋霜冬石,一幅山季图用最省的笔墨点染而成。"水落而石出"至今活在成语里。'},
    {o:'朝而往,暮而归,四时之景不同,而乐亦无穷也。',
     t:'早晨进山,傍晚返回,四季的景色不同,乐趣也是无穷无尽的。',
     c:'束住写景之半篇:景无穷故乐无穷——"乐"字自此成为下文的线索字。'},
    {p:true, o:'至于负者歌于途,行者休于树,前者呼,后者应,伛偻提携,往来而不绝者,滁人游也。',
     t:'至于背东西的人在路上唱歌,赶路的人在树下休息,前面的呼喊,后面的应答,老人弯着腰走,大人牵着小孩,来来往往络绎不绝的,是滁州百姓在出游。',
     c:'由山水之乐转入人事之乐。一串白描,勾出一幅太平行乐图——太守之乐,首先要滁人能乐。',
     note:{title:'伛偻提携', text:'"伛偻"指弯腰曲背的老人,"提携"指被牵携的孩子,与《桃花源记》"黄发垂髫"同一借代手法。这一段写百姓扶老携幼进山游玩,是"政通人和"的生动注脚——太守之乐的前提是滁人之乐。'}},
    {o:'临溪而渔,溪深而鱼肥;酿泉为酒,泉香而酒洌;山肴野蔌,杂然而前陈者,太守宴也。',
     t:'到溪边钓鱼,溪水深,鱼儿肥;用酿泉的泉水酿酒,泉水香,酒色清;山中的野味野菜,杂乱地摆在面前的,是太守的宴席。',
     c:'宴席不用钟鸣鼎食,只取溪鱼山蔬、泉酿之酒——清贫中的丰足,正是醉翁风味。',
     note:{title:'"泉香而酒洌"', text:'一本作"泉洌而酒香",通行本多为"泉香而酒洌"。两版皆通,且都用了互文见义的妙处:泉水既香又清冽,酒既清冽又芳香——两句交错,不可拘泥字面。'}},
    {o:'宴酣之乐,非丝非竹,射者中,弈者胜,觥筹交错,起坐而喧哗者,众宾欢也。',
     t:'宴饮酣畅的乐趣,不在于音乐,投壶的投中了,下棋的下赢了,酒杯和酒筹交互错杂,人们时起时坐,大声喧哗的,是宾客们尽情欢乐。',
     c:'"非丝非竹"与《兰亭》"虽无丝竹管弦之盛"异曲同工:众宾之欢全在人情之畅,不在声色之娱。"觥筹交错"四字至今是宴饮的代名词。',
     note:{title:'"射"是投壶', text:'古代宴会的"射",指"投壶"之戏:把箭矢投向壶中,以投中多少赌酒,盛行于士大夫宴集;弈即下围棋。众宾之欢,全在游戏酣饮,不假钟鼓丝竹。'}},
    {o:'苍颜白发,颓然乎其间者,太守醉也。',
     t:'容颜苍老,头发花白,醉醺醺地坐在人群中间的,是太守醉倒了。',
     c:'一个特写镜头收束宴乐场面:众宾愈欢,太守愈颓——"颓然"二字憨态可掬,又隐然有借酒自放之意。'},
    {p:true, o:'已而夕阳在山,人影散乱,太守归而宾客从也。树林阴翳,鸣声上下,游人去而禽鸟乐也。',
     t:'不久夕阳落在山头,人影纵横散乱,是太守回城、宾客跟随了。树林渐渐昏暗,上下传来鸟鸣声,是游人离开后鸟儿在欢唱啊。',
     c:'宴散人归,镜头又推向暮山禽鸟。人与鸟各得其所,一"乐"字由人及物,境界愈推愈广。'},
    {o:'然而禽鸟知山林之乐,而不知人之乐;人知从太守游而乐,而不知太守之乐其乐也。',
     t:'然而禽鸟只知道山林的乐趣,却不知道人的乐趣;人们只知道跟随太守游玩的快乐,却不知道太守是把他们的快乐当作快乐啊。',
     c:'三层"乐"的辨析,层层递进:鸟乐在林,人乐在游,太守乐在"乐其乐"——与民同乐,才是太守之乐的真谛。文心之细,如剥春笋。'},
    {o:'醉能同其乐,醒能述以文者,太守也。太守谓谁?庐陵欧阳修也。',
     t:'醉了能够同大家一起欢乐,醒来能够用文章记述这乐事的人,是太守。太守是谁?是庐陵的欧阳修啊。',
     c:'结尾自问自答,揭出姓名,全文数十个"……者,……也"的谜面至此全部揭底。戛然一收,而余味不尽:太守、醉翁、庐陵欧阳修,一人三名,正是"醉翁之意"的三重境界。'}

/* ============ 赤壁赋 · 苏轼 ============ */
ARTICLES.push({
  id:'chibifu', title:'赤壁赋', author:'苏轼', dynasty:'北宋', year:'元丰五年(1082)',
  tags:['苏轼','赤壁','黄州','乌台诗案','赋','水月','变与不变'],
  brief:'元丰二年,苏轼因"乌台诗案"几死狱中,次年贬为黄州团练副使,形同流放。元丰五年七月与十月,他两游城外赤壁,写下《赤壁赋》《后赤壁赋》与《念奴娇·赤壁怀古》,世称"赤壁三��"。本赋以主客问答的形式,由乐而悲、由悲而旷:客哀人生之须臾,苏子以水月为喻,道出"变与不变"的哲理——全文如行云流水,是宋代文赋的巅峰。',
  units:[
    {p:true, o:'壬戌之秋,七月既望,苏子与客泛舟游于赤壁之下。',
     t:'壬戌年的秋天,七月十六日,我与客人在赤壁之下泛舟游览。',
     c:'点明时间、人物、地点、事件,笔致从容。"既望"是月圆之后的第一个望日,暗伏下文"月出于东山"之景。',
     note:{title:'乌台诗案与黄州岁月', text:'元丰二年(1079),苏轼因诗文被指"讥讪朝政"下御史台狱(御史台官署遍植柏树,乌鸦栖集,称"乌台"),几乎论死,经多方营救后贬黄州(今湖北黄冈)任团练副使,"不得签书公事",形同流放。政治生命跌入谷底的苏轼,却在黄州完成了精神与艺术的双重突围:躬耕东坡,自号"东坡居士",写下前后《赤壁赋》与《念奴娇·赤壁怀古》。本文所游为黄州赤鼻矶,并非三国鏖兵的武昌赤壁,苏轼意在借地抒怀,真假与否,无关宏旨。'}},
    {o:'清风徐来,水波不兴。举酒属客,诵明月之诗,歌窈窕之章。',
     t:'清风缓缓吹来,水面波澜不起。举起酒杯劝客人同饮,吟诵《明月》的诗篇,唱着《窈窕》的章节。',
     c:'"清风徐来,水波不兴"八字,把人带入一个澄明宁静的世界。诵诗、唱歌,文雅之乐层层铺开,是"乐"的第一层。',
     note:{title:'"明月之诗""窈窕之章"', text:'指《诗经·陈风·月出》一诗,其首章有"月出皎兮,佼人僚兮,舒窈纠兮"之句("窈纠"与"窈窕"音近义通)。先诵明月之诗,正为下文真正的月出蓄势——文人雅集的仪式感,全在伏笔之中。'}},
    {o:'少焉,月出于东山之上,徘徊于斗牛之间。白露横江,水光接天。',
     t:'不一会儿,月亮从东山上升起,在斗宿和牛宿之间徘徊。白茫茫的雾气笼罩江面,水光与天光连成一片。',
     c:'"徘徊"二字赋予明月以情态,似不忍骤离山巅。白露横江、水光接天,天地一白,人为之澄怀。'},
    {o:'纵一苇之所如,凌万顷之茫然。浩浩乎如冯虚御风,而不知其所止;飘飘乎如遗世独立,羽化而登仙。',
     t:'任凭小船漂到哪里,越过茫茫万顷的江面。浩浩荡荡,就像凌空乘风飞行,不知道将停在哪里;飘飘然像脱离尘世、超然独立,成为神仙而飞升仙境。',
     c:'由景入神:一叶小舟放乎万顷烟波,"冯虚御风""羽化登仙"两喻,写出遗世之乐——这是"乐"的极处,也是"悲"的伏笔:极乐之中,人最容易忽然意识到自身的渺小。',
     note:{title:'一苇与斗牛', text:'"一苇"语出《诗经·河广》"谁谓河广?一苇杭之",指小船如一片苇叶。"斗牛"即斗宿、牛宿,二十八宿中的两宿。另:"冯虚御风"的"冯"通"凭",依托之意;"浩浩乎""飘飘乎"两个"乎"字领起的并列,是赋体铺陈的当行本色。'}},
    {p:true, o:'于是饮酒乐甚,扣舷而歌之。歌曰:"桂棹兮兰桨,击空明兮溯流光。渺渺兮予怀,望美人兮天一方。"',
     t:'于是喝着酒,快乐极了,敲着船边唱起歌来。歌道:"桂木做的棹啊木兰做的桨,划破月光下的清波啊,逆着流动的波光而上。我的心怀啊多么悠远,遥望心中的美人啊,在天的那一方。"',
     c:'骚体之歌插入赋中,音节忽变。"望美人兮天一方"句兼《离骚》遗意——"美人"喻君王或理想,一字乐中藏悲,文章由乐转悲的暗流自此涌动。'},
    {o:'客有吹洞箫者,倚歌而和之。其声呜呜然,如怨如慕,如泣如诉,余音袅袅,不绝如缕。舞幽壑之潜蛟,泣孤舟之嫠妇。',
     t:'有位客人吹洞箫,随着歌声应和。箫声呜呜,像是哀怨,像是爱慕,像哭泣,像倾诉,余音悠长宛转,像细丝一样绵延不断。能使深谷中的蛟龙起舞,能使孤舟上的寡妇哭泣。',
     c:'箫声一段,是全文的音色由明转暗的枢纽。四"如"字连缀,六组叠字般的比喻,把不可闻之声写得可感可触;"舞""泣"两个使动用法,侧面写尽箫声之悲。',
     note:{title:'客为谁?', text:'客的身份,历来有揣测为道士杨世昌者(善吹箫,苏轼文集中可考)。但更宜把"客"读作赋体的虚构设问:主客问答是汉大赋以来的传统结构,客之悲,正是苏轼内心悲慨一面的化身——下文苏子与客的哲理对话,实为苏轼心中两种声音的交锋。'}},
    {p:true, o:'苏子愀然,正襟危坐而问客曰:"何为其然也?"',
     t:'我容色骤变,整了整衣襟,端正地坐着问客人:"(箫声)为什么这样(哀怨)呢?"',
     c:'"愀然"一转,由飘飘欲仙跌回人间。"正襟危坐"四字有戏剧感——娱乐结束,哲思开场。'},
    {o:'客曰:"月明星稀,乌鹊南飞",此非曹孟德之诗乎?',
     t:'客人说:"月明星稀,乌鹊南飞",这不就是曹孟德的诗吗?',
     c:'客答辞以眼前之月起兴,随手拈来曹操《短歌行》——眼前江月与千年前诗中之月叠合,怀古之门由此推开。'},
    {o:'西望夏口,东望武昌,山川相缪,郁乎苍苍,此非孟德之困于周郎者乎?',
     t:'向西望是夏口,向东望是武昌,山川相互缭绕,树木茂密苍苍,这不正是曹孟德被周瑜围困的地方吗?',
     c:'指点江山,如数家珍。眼前山川即古战场,空间的实在感为下文"而今安在"的时间虚无感作最重的铺垫。'},
    {o:'方其破荆州,下江陵,顺流而东也,舳舻千里,旌旗蔽空,酾酒临江,横槊赋诗,固一世之雄也,而今安在哉?',
     t:'当初他攻破荆州,攻下江陵,顺着长江向东进军,战船首尾相接千里,旌旗遮蔽天空,面对大江斟酒,横执长矛吟诗,本是一代英雄啊,可如今又在哪里呢?',
     c:'先以"舳舻千里,旌旗蔽空"极力铺写曹操之盛,再以"而今安在哉"五字轻轻一扫——盛极而空,千古英雄同归寂灭。一扬一抑之间,人生的虚无感扑面而来。',
     note:{title:'横槊赋诗与赤壁之战', text:'建安十三年(208),曹操统一北方后南下,荆州不战而降,遂有一时之盛;旋即在赤壁被孙刘联军火攻击败,奠定三分之势。"酾酒临江,横槊赋诗"是苏轼对曹操形象的文学想象(本于《前赤壁赋》之前的传闻),雄豪之气跃然纸上——愈写其盛,愈衬其亡。'}},
    {o:'况吾与子渔樵于江渚之上,侣鱼虾而友麋鹿,驾一叶之扁舟,举匏樽以相属。寄蜉蝣于天地,渺沧海之一粟。哀吾生之须臾,羡长江之无穷。',
     t:'何况我和你在江中小洲上捕鱼砍柴,以鱼虾为伴侣,以麋鹿为朋友,驾着一只小船,举起葫芦做的酒杯互相劝酒。像蜉蝣一样寄托在天地之间,渺小得如同大海中的一粒粟米。哀叹我们生命的短暂,羡慕长江的无穷无尽。',
     c:'客的悲慨至此和盘托出:曹孟德一世之雄尚且归于空无,吾辈渔樵之微,更如蜉蝣寄世、沧海一粟。"哀吾生之须臾,羡长江之无穷"十四字,是全赋悲感的顶点,也是古今共通的生命之叹。'},
    {o:'挟飞仙以遨游,抱明月而长终。知不可乎骤得,托遗响于悲风。',
     t:'(我想)携同仙人遨游四方,抱着明月永存世间。知道这些不可能屡屡得到,只好把这份无奈寄托在悲凉的箫声中。"',
     c:'想成仙不得,想长生不得——一切超越有限生命的路都走不通,悲绪遂化作"托遗响于悲风"的箫声。客的话至此说完,文章的太极推手交给"苏子"。'},
    {p:true, o:'苏子曰:"客亦知夫水与月乎?逝者如斯,而未尝往也;盈虚者如彼,而卒莫消长也。',
     t:'我说:"你也知道那水与月吗?流去的水像这样(不断流去),却并没有真正逝去;月亮时圆时缺像那样(变化着),却终究没有增减。',
     c:'就地取材,以眼前水月说理——这是全文的神来之笔:方才引人兴悲的水与月,转眼成为解悲的良药。水的"逝"与"未尝往",月的"盈虚"与"莫消长",一组矛盾的字面下藏着变与不变的两重视角。',
     note:{title:'"逝者如斯"的出处', text:'语出《论语·子罕》:"子在川上曰:逝者如斯夫,不舍昼夜。"孔子川上之叹本是时间流逝之悲,苏轼却翻出新意:从"变"的角度看,万物每一瞬都在流逝;从"不变"的角度看,江水仍是这条江水,明月仍是这轮明月。庄子"方生方死"的齐物之思与禅家"不增不减"的观照,在此融为一体。'}},
    {o:'盖将自其变者而观之,则天地曾不能以一瞬;自其不变者而观之,则物与我皆无尽也,而又何羡乎!',
     t:'如果从那变化的一面来看,那么天地间的万物连一眨眼的工夫都不曾保持不变;从那不变的一面来看,万物与我们都是永恒无尽的,又有什么可羡慕的呢!',
     c:'两句对举,道尽全赋哲理的核心:悲与旷,只在一念视角之间。既然物我皆无尽,则"哀吾生之须臾"全然无谓——道理说得如此从容,如话家常,而理趣无穷,这正是宋文理性之美的极致。'},
    {o:'且夫天地之间,物各有主,苟非吾之所有,虽一毫而莫取。惟江上之清风,与山间之明月,耳得之而为声,目遇之而成色,取之无禁,用之不竭。是造物者之无尽藏也,而吾与子之所共适。"',
     t:'再说天地之间,万物各有主宰,如果不是属于我的,即使一丝一毫也不能取用。只有这江上的清风和山间的明月,耳朵听到便成为悦耳的声音,眼睛看到便成为悦目的颜色,取用它没有人禁止,使用它不会枯竭。这是大自然无穷无尽的宝藏,是我和你可以共同享受的。"',
     c:'由形上之理归于生活之乐:功名利禄"各有主",清风明月却无主而共适。把审美的自由说成最大的富有——这是中国文人安顿自我最优美的一段话,后世"清风明月不用一钱买"之意皆本于此。'},
    {p:true, o:'客喜而笑,洗盏更酌。肴核既尽,杯盘狼籍。相与枕藉乎舟中,不知东方之既白。',
     t:'客人高兴地笑了,洗净酒杯重新斟酒。菜肴果品都已吃完,杯盘凌乱地放着。大家互相枕着靠着睡在船中,不知不觉东方已经露出白色的曙光。',
     c:'客"喜而笑"——内心的悲慨被哲理化解,全文由乐而悲、由悲而旷,至此复归于乐,完成一个圆环。"不知东方之既白"七字收尾,浑然忘我之境如在目前:一夜问答,竟不知天已破晓。',
     note:{title:'赋体结构与"文赋"', text:'本篇采用汉赋"主客问答、抑客伸主"的经典框架,却全然不用铺张扬厉的骚体句式,而以流畅的散句出之,骈散相间、韵散交替——这种以散文笔法写赋的新体式,称"文赋",是宋代古文运动的创造。欧阳修《秋声赋》开其端,苏轼《赤壁赋》集其大成。后人评此赋"风行水上,自然成文",把它与《兰亭集序》并称为古今写景抒情文的两大绝诣。'}}
  ]
});

/* ============ 阿房宫赋 · 杜牧 ============ */
ARTICLES.push({
  id:'epanggong', title:'阿房宫赋', author:'杜牧', dynasty:'唐', year:'宝历元年(825)前后',
  tags:['杜牧','阿房宫','秦','借古讽今','赋','骈散'],
  brief:'杜牧二十三岁时作此赋,借秦始皇营建阿房宫的奢靡与速亡,警醒正在大起宫室的唐敬宗:"宝历大起宫室,广声色,故作《阿房宫赋》。"文章前半极力铺写宫室之美、宫人之众、珍宝之盛,后半以"秦爱纷奢"陡转,一连串"多于"的排比如巨浪排空,最后以"后人哀之而不鉴之"的警告收束,是借古讽今赋体的第一杰作。',
  units:[
    {p:true, o:'六王毕,四海一,蜀山兀,阿房出。',
     t:'六国覆灭,天下统一;蜀地的山秃了,阿房宫建成了。',
     c:'起笔十二字,两组对比,四组因果:六王毕→四海一,蜀山兀→阿房出。字字如锤,先把一代兴亡的大开大阖压进十六个字里。',
     note:{title:'杜牧作赋的背景', text:'杜牧(803-852)出身京兆杜氏,祖父杜佑是中唐名相、《通典》作者。他写此赋时年仅二十三岁。唐敬宗李湛十六岁即位,昏嬉无度,大兴土木、广选声色,宝历年间朝政日非。杜牧在《上知己文章启》中自述:"宝历大起宫室,广声色,故作《阿房宫赋》。"——一篇咏史之赋,实为一封谏书。'}},
    {o:'覆压三百余里,隔离天日。骊山北构而西折,直走咸阳。',
     t:'(阿房宫)覆盖压绵延三百多里,遮天蔽日。从骊山北边建构,折而向西,一直通到咸阳。',
     c:'"覆压""隔离"两个夸张的动词写宫之巨。山势与宫势合一,如巨龙横卧关中。'},
    {o:'二川溶溶,流入宫墙。五步一楼,十步一阁;廊腰缦回,檐牙高啄;各抱地势,钩心斗角。',
     t:'渭水、樊川两条河缓缓流淌,流进宫墙。五步一座楼,十步一座阁;走廊曲折如绸带回环,檐角翘起像鸟嘴向空中啄食;各依地势建置,互相环抱,中心相钩、檐角相斗。',
     c:'"廊腰缦回,檐牙高啄"以人体、鸟喙拟建筑,静物顿时飞动。"钩心斗角"写楼阁参差抱合之状,后来竟成成语——今日用它形容人与人各用心机,恰是词义的奇妙漂流。',
     note:{title:'阿房宫到底建成了吗?', text:'一个有趣的历史真相:据2002年以来中国社科院考古所对西安阿房宫前殿遗址的勘探发掘,前殿夯土台基之上竟无一处秦代宫殿建筑遗存——阿房宫前殿很可能只是完成了地基,秦亡即辍工,并未真正建成。"覆压三百余里"是夸张;"楚人一炬"所烧的主要是咸阳宫等建成的宫室(项羽烧秦宫,史有其事)。但文学的真实不等于考古的真实:杜牧赋中的阿房宫,是一个象征暴君奢欲的文学意象,其震撼力千年不衰。'}},
    {o:'盘盘焉,囷囷焉,蜂房水涡,矗不知其几千万落。',
     t:'盘结交错,回旋屈曲,像蜂房,像水涡,高高矗立,不知道有几千几万座。',
     c:'"蜂房水涡"两个比喻,把楼阁群的密集回环写活了。"矗不知其几千万落"以不可计数写规模,夸而有当。'},
    {o:'长桥卧波,未云何龙?复道行空,不霁何虹?',
     t:'长桥横卧在水上,没有云,哪来的龙?楼阁间的通道架在半空,不是雨过天晴,哪来的彩虹?',
     c:'两组反诘妙绝:不说桥如龙、道如虹,而惊问"未云何龙""不霁何虹"——把比喻升格为错觉,惊叹之情溢于言表。这是形容最高的笔法。',
     note:{title:'"霁"与文言词义', text:'"霁"指雨雪初停、天色放晴。"不霁何虹"意为不是雨后天晴,哪来彩虹?桥横水上疑为龙,道架空中疑为虹——皆以"不可能的真物"状奇景。'}},
    {o:'高低冥迷,不知西东。歌台暖响,春光融融;舞殿冷袖,风雨凄凄。一日之内,一宫之间,而气候不齐。',
     t:'高高低低,幽深迷离,分辨不清东西。歌台上由于歌声响亮而充满暖意,如同春光融融;舞殿上由于舞袖飘拂而充满寒意,如同风雨凄凄。同在一天之内,同在一宫之间,而气候却如此不同。',
     c:'由空间之奇转入感官之奇:"歌台暖响""舞殿冷袖"以通感写歌舞——歌声有温度,舞袖有寒意。"气候不齐"一语双关:既写宫中歌舞冷热之异,又暗写人间苦乐之不均,讽意已伏于此。'},
    {p:true, o:'妃嫔媵嫱,王子皇孙,辞楼下殿,辇来于秦。朝歌夜弦,为秦宫人。',
     t:'六国的妃嫔、媵妾、宫女、王侯的孙女,辞别六国的楼阁宫殿,被辇车送到秦国。早晚唱歌奏乐,成为秦国的宫人。',
     c:'第二段由宫室写及宫人。"辞楼下殿,辇来于秦"八字,写尽亡国之女的命运——不是倾慕而来,是被掳而来,下文"望幸"的悲剧由此定调。'},
    {o:'明星荧荧,开妆镜也;绿云扰扰,梳晓鬟也;渭流涨腻,弃脂水也;烟斜雾���,焚椒兰也。',
     t:'明星闪烁,是(宫人们)打开梳妆的镜子;乌黑的云朵纷纷扰扰,是她们早晨梳理发鬟;渭水河面浮起一层油腻,是她们倒掉的胭脂水;烟雾歪斜、雾气弥漫,是她们焚烧椒兰(的香气)。',
     c:'千古名段:镜如明星,鬟如绿云,脂水涨腻渭河,香气凝成烟雾——四组比喻全用"是……也"的判断句倒装,如谜面次第揭晓。写宫人之多而不着一个"多"字,极艳丽又极凄凉。',
     note:{title:'排比中的"暗讽"', text:'这段貌似极写繁华,细读却处处是血泪:多少女子梳妆,说明多少人被掳;脂水能"涨腻"一条渭河,宫人之众可以想见。杜牧以美写悲的手法,与后文"秦人视之,亦不甚惜"的冷峭形成呼应——铺陈愈美,控诉愈深。'}},
    {o:'雷霆乍惊,宫车过也;辘辘远听,杳不知其所之也。',
     t:'雷声忽然响起,原来是皇上的宫车驰过;车轮声辘辘地越听越远,不知它驶向什么地方。',
     c:'以雷霆喻车声,以"乍惊"写宫人心理——每一声车响都牵动千百颗心。车声远去,"杳不知其所之",则失望之深,尽在不言中。'},
    {o:'一肌一容,尽态极妍,缦立远视,而望幸焉;有不见者,三十六年。',
     t:'每一处肌肤、每一种容态,都极尽娇美,久立远望,盼望皇帝的宠幸;有的宫人三十六年都没有见到过(皇帝一面)。',
     c:'"一肌一容,尽态极妍"极写美,"望幸"与"有不见者,三十六年"极写怨——秦始皇在位三十七年(此处取整),竟有宫人终其一生未曾一面。以美人喻贤才不遇的深沉寄托,藏于宫怨的叙事之中。',
     note:{title:'"三十六年"', text:'指秦始皇在位年数(前221统一后至前210崩,如从称秦王算起则共三十七年,赋中取约数)。这句是全段最冷的一笔:用一个人的一生,丈量一座宫的荒淫。'}},
    {o:'燕赵之收藏,韩魏之经营,齐楚之精英,几世几年,剽掠其人,倚叠如山。一旦不能有,输来其间。',
     t:'燕国赵国收藏的(珠玉),韩国魏国经营的(珍宝),齐国楚国保存的(精华),多少代多少年,(从)它们的人民那里抢掠而来,堆积如山。一旦(国家灭亡)不能再拥有,全都运进了阿房宫中。',
     c:'"剽掠其人"四字最重——六国之珍,皆是民脂民膏。由宫人转写珍宝,处处双线并进:亡六国者,固自亡也;而珍宝"输来其间",又预伏秦亡之速。'},
    {o:'鼎铛玉石,金块珠砾,弃掷逦迤,秦人视之,亦不甚惜。',
     t:'把宝鼎看作铁锅,把美玉看作石头,把黄金看作土块,把珍珠看作石子,丢弃满地,秦人看到这些,也不太珍惜。',
     c:'四个"把X看作Y"的意动用法排比,写尽暴殄天物。六国几世几年剽掠而来的珍宝,在秦人眼中竟贱如铛、石、块、砾——奢靡至此,离败亡只差一根火柴。',
     note:{title:'意动用法', text:'"鼎铛玉石,金块珠砾"是文言意动用法(以鼎为铛、以玉为石、以金为块、以珠为砾)的浓缩表达:名词直接连用,前一名词被当作后一名词看待。这类紧缩句式是本文语言上最见功力处,读时须还原为"以……为……"。'}},
    {p:true, o:'嗟乎!一人之心,千万人之心也。秦爱纷奢,人亦念其家。奈何取之尽锱铢,用之如泥沙?',
     t:'唉!一个人的心,也是千万个人的心。秦始皇喜欢繁华奢侈,老百姓也都顾念自己的家啊。为什么搜刮别人的钱财时一分一厘也不放过,挥霍起来却像泥沙一样(不加珍惜)呢?',
     c:'第三段议论开始。"一人之心,千万人之心也"是全赋哲理的关键:秦也是人,也知顾念;却以己之奢,夺万人之念。"尽锱铢""如泥沙"两组极端对照,贪吝与挥霍的悖谬,一问而尽。',
     note:{title:'锱铢', text:'"锱""铢"都是古代极小的重量单位(六铢为一锱,四锱为一两),"锱铢"代指极微小的数量。与"泥沙"对举,数量级的巨大反差本身就是控诉。'}},

/* ================= 渲染逻辑 ================= */
const tabsEl = document.getElementById('tabs');
const bodyEl = document.getElementById('article-body');
const searchEl = document.getElementById('search');
const noResEl = document.getElementById('no-result');
let activeId = null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function unitHTML(u){
  return `<div class="unit${u.p ? ' para' : ''}">
    <div class="orig">${esc(u.o)}</div>
    <div class="side">
      <div class="trans">${esc(u.t)}</div>
      ${u.c ? `<div class="comm"><span class="comm-tag">赏析</span>${esc(u.c)}</div>` : ''}
      ${u.note ? `<div class="note"><span class="note-tag">史识</span><b>${esc(u.note.title)}</b>${esc(u.note.text)}</div>` : ''}
    </div>
  </div>`;
}

function articleHTML(a){
  const units = a.units.map(unitHTML).join('');
  return `<div class="art-head">
      <h2>${esc(a.title)}</h2>
      <div class="art-meta"><b>${esc(a.author)}</b> · ${esc(a.dynasty)}${a.year ? ' · ' + esc(a.year) : ''}</div>
      <div class="brief">${esc(a.brief)}</div>
    </div>${units}`;
}

function renderTabs(filter){
  const f = (filter || '').trim().toLowerCase();
  tabsEl.innerHTML = '';
  let visible = 0;
  ARTICLES.forEach(a => {
    const hay = (a.title + a.author + a.dynasty + (a.tags || []).join('')).toLowerCase();
    if (f && !hay.includes(f)) return;
    visible++;
    const b = document.createElement('button');
    b.className = 'tab' + (a.id === activeId ? ' active' : '');
    b.innerHTML = `<span class="tab-title">${esc(a.title)}</span><span class="tab-sub">${esc(a.author)} · ${esc(a.dynasty)}</span>`;
    b.addEventListener('click', () => {
      activeId = a.id;
      renderTabs(searchEl.value);
      renderArticle(a);
      window.scrollTo({top: 0, behavior: 'auto'});
    });
    tabsEl.appendChild(b);
  });
  noResEl.style.display = visible ? 'none' : 'block';
}

function renderArticle(a){
  bodyEl.innerHTML = articleHTML(a);
}

searchEl.addEventListener('input', () => renderTabs(searchEl.value));

activeId = ARTICLES[0].id;
renderTabs('');
renderArticle(ARTICLES[0]);
</script>
